name: daily-stock-ratings

on:
  workflow_dispatch:
    inputs:
      skip_prices:
        description: "Skip the price refresh entirely"
        type: boolean
        default: false
      provider:
        description: "Force a specific price provider (default = normal cascade)"
        type: choice
        default: default
        options:
          - default
          - alpha_vantage
          - twelve_data
          - stooq
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-ratings-and-build-dashboard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run daily planner
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_MAX_REQUESTS_PER_RUN: 18
          ALPHA_VANTAGE_MIN_INTERVAL_SECONDS: ${{ secrets.ALPHA_VANTAGE_MIN_INTERVAL_SECONDS }}
          TWELVE_DATA_MAX_REQUESTS_PER_RUN: 24
          STOOQ_MAX_REQUESTS_PER_RUN: ${{ secrets.STOOQ_MAX_REQUESTS_PER_RUN }}
          STOOQ_MIN_INTERVAL_SECONDS: ${{ secrets.STOOQ_MIN_INTERVAL_SECONDS }}
          STOCK_RATING_SYMBOL_LIMIT: ${{ secrets.STOCK_RATING_SYMBOL_LIMIT }}
          STOCK_RATING_FUNDAMENTAL_SYMBOL_LIMIT: ${{ secrets.STOCK_RATING_FUNDAMENTAL_SYMBOL_LIMIT }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          STOCK_RATING_ANALYST_SYMBOL_LIMIT: 6
          STOCK_RATING_FINNHUB_ANALYST_SYMBOL_LIMIT: 5
          FINNHUB_ANALYST_MIN_INTERVAL_SECONDS: ${{ secrets.FINNHUB_ANALYST_MIN_INTERVAL_SECONDS }}
        run: |
          ARGS=""
          if [ "${{ inputs.skip_prices }}" = "true" ]; then
            ARGS="$ARGS --skip-prices"
          fi
          if [ -n "${{ inputs.provider }}" ] && [ "${{ inputs.provider }}" != "default" ]; then
            ARGS="$ARGS --provider ${{ inputs.provider }}"
          fi
          echo "Running: python -m stock_rating.pipeline.daily$ARGS"
          python -m stock_rating.pipeline.daily $ARGS
      - name: Generate dashboard html
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m stock_rating.pipeline.report
      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p _site
          cp artifacts/reports/* _site/
          cp artifacts/reports/ratings-dashboard.html _site/index.html
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy-dashboard:
    runs-on: ubuntu-latest
    needs: update-ratings-and-build-dashboard
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
