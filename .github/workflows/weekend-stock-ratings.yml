name: weekend-stock-ratings

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 6,0"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-slow-inputs-and-build-dashboard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Refresh slow-moving inputs and rebuild ratings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m stock_rating.pipeline.weekend
      - name: Generate dashboard html
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m stock_rating.pipeline.report
      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p _site
          cp artifacts/reports/*.html _site/
          cp artifacts/reports/ratings-dashboard.html _site/index.html
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy-dashboard:
    runs-on: ubuntu-latest
    needs: refresh-slow-inputs-and-build-dashboard
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
