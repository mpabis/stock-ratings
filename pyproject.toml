[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-rating"
version = "0.1.0"
description = "Daily stock rating pipeline scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"psycopg[binary]>=3.2,<4",
	"python-dotenv>=1.0,<2",
	"fastapi>=0.115,<1",
	"uvicorn>=0.30,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
